<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AnsweredCall answers every contractor call, qualifies every lead, and delivers the full intake instantly — name, phone, address, job type, urgency, and transcript[...]
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AnsweredCall | Phone Intake" />
  <meta property="og:description" content="Every call answered. Every lead captured. Built for contractors who can't afford a missed call." />
  <meta property="og:url" content="https://answeredcall.us/phone-intake" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="AnsweredCall | Phone Intake" />
  <meta name="twitter:description" content="Every call answered. Every lead captured. Built for contractors who can't afford a missed call." />
  <title>AnsweredCall | Phone Intake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #faf6ef;
    --off-white: #f3ecdd;
    --light: #f5f1e8;
    --border: #e3d5b8;
    --border-dark: #d4c4b0;
    --teal: #2d5a6f;
    --teal-light: #467489;
    --teal-dark: #1f4456;
    --cream: #f5f1e8;
    --cream-dark: #e3d5b8;
    --text-dark: #221b12;
    --text-secondary: #6b5f4d;
    --text-muted: #7b7368;
    --border-light: #e3d5b8;
    --surface: #faf6ef;
    --surface-muted: #f3ecdd;
    --shadow-soft: 0 18px 42px rgba(45, 90, 111, 0.08);
    --dark: #f3ecdd;
    --muted: #666666;
    --muted-light: #666666;
    --text: #1a1a1a;
  }

  html { scroll-behavior: smooth; }

  section[id] { scroll-margin-top: 60px; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--white);
    color: var(--text-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo {
    width: 32px;
    height: 32px;
    background: var(--teal);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-logo svg {
    width: 18px;
    height: 18px;
    fill: white;
  }

  .nav-brand-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }

  .nav-cta {
    background: var(--teal);
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 6px;
    transition: background 0.15s;
  }

  .nav-cta:hover { background: var(--teal-dark); }

  /* HERO */
  .hero {
    min-height: 88vh;
    display: flex;
    align-items: center;
    padding: 5rem 2rem 4rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(45,90,111,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(245,241,232,0.9) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 5rem;
    align-items: center;
  }

  .hero-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hero-eyebrow::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 1px;
    background: var(--teal);
  }

  .hero-headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 7vw, 84px);
    line-height: 0.95;
    letter-spacing: 1px;
    color: var(--text-dark);
    margin-bottom: 1.75rem;
  }

  .hero-headline .accent {
    color: var(--teal);
    display: block;
  }

  .hero-sub {
    font-size: 17px;
    font-weight: 300;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 520px;
    margin-bottom: 2.5rem;
  }

  .hero-sub strong {
    color: var(--text-dark);
    font-weight: 500;
  }

  .hero-cta-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--teal);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 8px;
    transition: all 0.15s;
    letter-spacing: -0.2px;
  }

  .btn-primary:hover {
    background: var(--teal-dark);
    transform: translateY(-1px);
  }

  .btn-primary svg {
    width: 16px;
    height: 16px;
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted-light);
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    transition: color 0.15s;
    padding: 4px 0;
  }

  .btn-secondary:hover { color: var(--text-dark); }

  .btn-secondary::after {
    content: '→';
    font-size: 14px;
    transition: transform 0.15s;
  }

  .btn-secondary:hover::after { transform: translateX(3px); }

  .cta-subtext {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 4px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .hero-trust {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .trust-check {
    width: 14px;
    height: 14px;
    background: rgba(45,90,111,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .trust-check::after {
    content: '✓';
    font-size: 9px;
    color: var(--teal);
    font-weight: 700;
  }

  /* HERO CARD */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 2rem;
    position: relative;
    box-shadow: var(--shadow-soft);
  }

  .hero-card::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 24px;
    right: 24px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
  }

  .card-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .card-feature {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .card-feature:last-child { border-bottom: none; }

  .card-feature-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    margin-top: 6px;
    flex-shrink: 0;
  }

  .card-feature-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .card-feature-text strong {
    color: var(--text-dark);
    font-weight: 500;
    display: block;
    font-size: 14px;
  }

  .priority-badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .priority-high,
  .priority-medium,
  .priority-low {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    line-height: 1;
    text-transform: uppercase;
  }

  .priority-high {
    background: rgba(45, 90, 111, 0.12);
    border-color: rgba(45, 90, 111, 0.22);
    color: var(--teal-dark);
  }

  .priority-medium {
    background: var(--cream);
    border-color: var(--border);
    color: var(--teal);
  }

  .priority-low {
    background: var(--surface-muted);
    border-color: var(--border-light);
    color: var(--text-secondary);
  }

  /* STATS BAR */
  .stats-bar {
    background: var(--off-white);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem;
  }

  .stats-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    text-align: center;
  }

  .stat-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--teal);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  /* SECTION SHARED */
  section {
    padding: 5rem 2rem;
  }

  .section-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-eyebrow::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 1px;
    background: var(--teal);
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 5vw, 56px);
    line-height: 1;
    color: var(--text-dark);
    margin-bottom: 1rem;
  }

  .section-sub {
    font-size: 16px;
    color: var(--text-secondary);
    max-width: 560px;
    font-weight: 300;
    line-height: 1.7;
  }

  /* HOW IT WORKS */
  .how-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5px;
    margin-top: 4rem;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .how-step {
    background: var(--off-white);
    padding: 2.5rem 2rem;
    position: relative;
  }

  .step-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    color: var(--border-light);
    line-height: 1;
    margin-bottom: 1rem;
    display: block;
  }

  .step-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 0.75rem;
  }

  .step-body {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    font-weight: 300;
  }

  .step-tag {
    display: inline-block;
    margin-top: 1.25rem;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--teal-dark);
    background: rgba(45,90,111,0.08);
    border: 1px solid rgba(45,90,111,0.18);
    padding: 4px 10px;
    border-radius: 4px;
  }

  /* VIDEO */
  .video-section {
    background: var(--off-white);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .video-header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    min-height: 300px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border-light);
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* PRICING */
  .pricing-section {
    background: var(--white);
  }

  .pricing-header {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .pricing-card {
    max-width: 520px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
  }

  .pricing-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--teal), var(--teal-light));
  }

  .pricing-card-header {
    padding: 2.5rem 2.5rem 2rem;
    border-bottom: 1px solid var(--border);
  }

  .pricing-plan-name {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .pricing-price {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-bottom: 6px;
  }

  .price-dollar {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--muted-light);
    margin-bottom: 10px;
  }

  .price-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    color: var(--text-dark);
    line-height: 1;
  }

  .price-period {
    font-size: 16px;
    color: var(--muted);
    font-weight: 300;
  }

  .price-setup {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  .price-setup span {
    color: var(--teal);
    font-weight: 500;
  }

  .pricing-features {
    padding: 2rem 2.5rem;
    border-bottom: 1px solid var(--border);
  }

  .pricing-feature {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
  }

  .feature-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(45,90,111,0.15);
    border: 1px solid rgba(45,90,111,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .feature-check::after {
    content: '✓';
    font-size: 10px;
    color: var(--teal);
    font-weight: 700;
  }

  .feature-text {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .feature-text strong {
    color: var(--text-dark);
    font-weight: 500;
  }

  .pricing-cta {
    padding: 2rem 2.5rem;
    text-align: center;
  }

  .btn-pricing {
    display: block;
    width: 100%;
    background: var(--teal);
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    transition: all 0.15s;
    margin-bottom: 16px;
  }

  .btn-pricing:hover {
    background: var(--teal-dark);
    transform: translateY(-1px);
  }

  .pricing-demo-note {
    font-size: 13px;
    color: var(--muted);
  }

  .pricing-demo-note a {
    color: var(--teal);
    text-decoration: none;
  }

  .pricing-demo-note a:hover {
    text-decoration: underline;
  }

  .copy-email-hint {
    color: var(--muted-light);
    font-size: 0.92em;
  }

  .copy-email {
    cursor: pointer;
  }

  .copy-toast {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    color: var(--teal);
    opacity: 0;
    transition: opacity 0.3s;
    font-family: 'DM Mono', monospace;
  }
  .copy-toast.show { opacity: 1; }

  .pricing-guarantee {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .pricing-secondary-cta {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    color: var(--teal);
    text-decoration: none;
    transition: color 0.15s;
    font-weight: 500;
  }

  .pricing-secondary-cta:hover { color: var(--teal-dark); }

  /* FOOTER */
  footer {
    background: var(--off-white);
    border-top: 1px solid var(--border);
    padding: 3.5rem 2rem 2rem;
  }

  .footer-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .footer-top {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 3rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .footer-brand-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.75rem;
  }

  .footer-logo {
    width: 28px;
    height: 28px;
    background: var(--teal);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .footer-logo svg {
    width: 14px;
    height: 14px;
    fill: white;
  }

  .footer-tagline {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 0.5rem;
  }

  .footer-built-by {
    font-size: 12px;
    color: var(--border-light);
  }

  .footer-nav-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .footer-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .footer-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.15s;
  }

  .footer-links a:hover { color: var(--text-dark); }

  .footer-contact-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .footer-contact-email {
    color: var(--teal);
    text-decoration: none;
    font-size: 14px;
    display: inline-block;
  }

  .footer-contact-email:hover { text-decoration: underline; }

  .footer-contact-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 8px;
  }

  .footer-contact-row .copy-toast {
    margin-left: 8px;
  }

  .footer-contact-service {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--border-light);
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .hero-inner {
      grid-template-columns: 1fr;
      gap: 3rem;
    }

    .hero-card { display: none; }

    .how-grid {
      grid-template-columns: 1fr;
    }

    .stats-inner {
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    .stat-number { font-size: 36px; }

    .footer-top {
      grid-template-columns: 1fr;
      gap: 2rem;
    }
  }

  @media (max-width: 600px) {
    nav { padding: 0 1rem; }
    .hero { padding: 3rem 1rem; }
    section { padding: 3.5rem 1rem; }
    .stats-inner { grid-template-columns: 1fr; text-align: left; }
    .hero-trust { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
    .footer-bottom { flex-direction: column; gap: 0.5rem; text-align: center; }
    .legal-grid { grid-template-columns: 1fr !important; gap: 2rem !important; }
  }

  /* DEMO CAPTURE */
  .demo-capture-section {
    background: var(--off-white);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4rem 2rem;
  }

  .demo-capture-card {
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
  }
